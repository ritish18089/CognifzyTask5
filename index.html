<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Advanced CRUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- 
      MAIN CONTAINER
      Strictly uses display: flex; flex-direction: column; gap: 32px; 
      to naturally stack sections in the normal document flow. 
    -->
    <div class="main-container">
        
        <!-- Header Section -->
        <header class="header glass">
            <div class="logo">
                <i class="fas fa-check-double"></i>
                <h1>TaskMaster</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="btn-icon" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Statistics Section -->
        <section class="dashboard">
            <div class="stat-card glass">
                <div class="stat-icon bg-primary">
                    <i class="fas fa-list"></i>
                </div>
                <div class="stat-info">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon bg-success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon bg-warning">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon bg-danger">
                    <i class="fas fa-fire"></i>
                </div>
                <div class="stat-info">
                    <h3>High Priority</h3>
                    <p id="highPriorityTasks">0</p>
                </div>
            </div>
        </section>

        <!-- Toolbar Section -->
        <section class="toolbar glass">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>
            <div class="filter-sort-group">
                <div class="select-wrapper">
                    <select id="filterSelect" aria-label="Filter tasks">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="select-wrapper">
                    <select id="sortSelect" aria-label="Sort tasks">
                        <option value="recent">Recently Added</option>
                        <option value="dueDate">Due Date</option>
                        <option value="priority">Priority</option>
                        <option value="alphabetical">Alphabetical</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-outline" id="importBtn" title="Import JSON">
                    <i class="fas fa-file-import"></i>
                </button>
                <button class="btn btn-outline" id="exportBtn" title="Export JSON">
                    <i class="fas fa-file-export"></i>
                </button>
                <button class="btn btn-danger btn-outline" id="clearAllBtn" title="Clear All">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button class="btn btn-primary" id="addTaskBtn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
        </section>

        <!-- Task List Section -->
        <section class="task-board">
            <div id="taskList" class="task-list">
                <!-- Tasks will be injected here via JS -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-illustration">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <h2>No tasks found</h2>
                <p>Create a new task or adjust your filters.</p>
            </div>
        </section>

    </div> <!-- End of main-container -->

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal-overlay hidden">
        <div class="modal glass">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>
                <button class="btn-close" id="closeModalBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="taskForm" class="modal-body">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" required minlength="3" maxlength="100" placeholder="e.g., Complete Project Presentation">
                    <span class="error-msg" id="titleError"></span>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Provide more details..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" required>
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate" required>
                        <span class="error-msg" id="dateError"></span>
                    </div>
                </div>
                <div class="form-group" id="statusGroup">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancelTaskBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal confirm-modal glass">
            <div class="modal-body text-center">
                <div class="warning-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2 id="confirmTitle">Are you sure?</h2>
                <p id="confirmMessage">This action cannot be undone.</p>
                <div class="modal-footer justify-center">
                    <button class="btn btn-outline" id="cancelConfirmBtn">Cancel</button>
                    <button class="btn btn-danger" id="proceedConfirmBtn">Yes, Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Input for File Import -->
    <input type="file" id="fileImport" accept=".json" style="display: none;">

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts (ES6 Modules) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
